<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>lookr | Body Metrics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "inverse-on-surface": "#eff1f2",
                        "tertiary-container": "#ffa15e",
                        "surface-tint": "#006c48",
                        "on-secondary-fixed-variant": "#165037",
                        "on-primary-fixed": "#002113",
                        "surface-container": "#eceeef",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3c4a41",
                        "surface-bright": "#f8fafb",
                        "inverse-surface": "#2e3132",
                        "on-tertiary-fixed-variant": "#723600",
                        "primary-container": "#00d18e",
                        "secondary": "#31694e",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#b4f0cd",
                        "tertiary-fixed": "#ffdcc6",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "surface-dim": "#d8dadb",
                        "outline-variant": "#bacabf",
                        "background": "#f8fafb",
                        "on-primary": "#ffffff",
                        "primary": "#006c48",
                        "outline": "#6b7b70",
                        "surface-container-high": "#e6e8e9",
                        "inverse-primary": "#2fe19c",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#99d3b2",
                        "on-tertiary-container": "#743700",
                        "tertiary": "#934b0c",
                        "secondary-fixed": "#b4f0cd",
                        "tertiary-fixed-dim": "#ffb786",
                        "surface-container-highest": "#e1e3e4",
                        "surface-container-low": "#f2f4f5",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed": "#311300",
                        "on-secondary-container": "#386f54",
                        "on-primary-container": "#005336",
                        "on-primary-fixed-variant": "#005235",
                        "error-container": "#ffdad6",
                        "surface": "#f8fafb",
                        "primary-fixed-dim": "#2fe19c",
                        "on-background": "#191c1d",
                        "primary-fixed": "#58feb7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .clinical-glow {
            box-shadow: 0px 12px 32px rgba(25, 28, 29, 0.04);
        }
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Header & Unit Toggle -->
<header class="w-full max-w-xl px-6 pt-12 flex flex-col gap-8">
<div class="flex items-center justify-between">
<!-- lookr Brand Logo: Geometric Path + Target -->
<div class="flex items-center gap-1.5">
<div class="w-6 h-6 bg-primary flex items-center justify-center rounded-sm">
<div class="w-1.5 h-1.5 bg-primary-container rounded-full translate-x-1 -translate-y-1"></div>
<div class="absolute w-3 h-3 border-l-2 border-b-2 border-primary-container rotate-45 rounded-bl-sm"></div>
</div>
<span class="font-headline font-extrabold text-2xl text-primary tracking-tighter">lookr</span>
</div>
<!-- Metric/Imperial Toggle -->
<div class="bg-surface-container-low p-1 rounded-full flex items-center gap-1">
<button class="px-4 py-1.5 text-[10px] font-label font-bold tracking-widest uppercase rounded-full bg-surface-container-lowest text-primary clinical-glow">Metric</button>
<button class="px-4 py-1.5 text-[10px] font-label font-bold tracking-widest uppercase rounded-full text-on-surface-variant hover:text-on-surface transition-colors">Imperial</button>
</div>
</div>
<div class="space-y-2">
<p class="text-primary font-label text-[10px] font-bold tracking-[0.2em] uppercase">Step 2 of 5</p>
<h1 class="text-4xl font-headline font-light tracking-tight">Body Metrics</h1>
<p class="text-on-surface-variant font-body text-base max-w-[280px]">Precise measurements allow us to calibrate your health baseline.</p>
</div>
</header>
<!-- Main Form Content -->
<main class="w-full max-w-xl px-6 py-8 flex-grow space-y-4">
<!-- Height Metric Card -->
<div class="bg-surface-container-low rounded-xl p-8 flex flex-col gap-6 group transition-all hover:bg-surface-container transition-colors">
<div class="flex justify-between items-end">
<label class="text-[10px] font-label font-bold tracking-[0.15em] uppercase text-on-surface-variant">Height</label>
<div class="flex items-baseline gap-1">
<span class="text-4xl font-headline font-bold text-on-surface">178</span>
<span class="text-on-surface-variant font-body">cm</span>
</div>
</div>
<!-- Visual Slider / Scale Representation -->
<div class="relative h-12 flex items-center">
<div class="absolute inset-0 flex justify-between items-center px-1">
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="h-6 w-[1px] bg-outline-variant"></div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="h-6 w-[1px] bg-outline-variant"></div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="h-10 w-[2px] bg-primary"></div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="h-6 w-[1px] bg-outline-variant"></div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="h-6 w-[1px] bg-outline-variant"></div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
</div>
<div class="w-full h-[1px] bg-outline-variant opacity-30"></div>
</div>
</div>
<!-- Weight & Age Grid (Asymmetric) -->
<div class="grid grid-cols-5 gap-4">
<!-- Weight Card -->
<div class="col-span-3 bg-surface-container-low rounded-xl p-8 flex flex-col gap-6 group hover:bg-surface-container transition-colors">
<label class="text-[10px] font-label font-bold tracking-[0.15em] uppercase text-on-surface-variant">Weight</label>
<div class="flex items-baseline gap-1">
<input class="bg-transparent border-none p-0 text-4xl font-headline font-bold text-on-surface w-full focus:ring-0 focus:border-none" type="text" value="72.5"/>
<span class="text-on-surface-variant font-body">kg</span>
</div>
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="w-[60%] h-full bg-primary-container"></div>
</div>
</div>
<!-- Age Card -->
<div class="col-span-2 bg-surface-container-low rounded-xl p-8 flex flex-col gap-6 group hover:bg-surface-container transition-colors">
<label class="text-[10px] font-label font-bold tracking-[0.15em] uppercase text-on-surface-variant">Age</label>
<div class="flex items-baseline gap-1">
<input class="bg-transparent border-none p-0 text-4xl font-headline font-bold text-on-surface w-full focus:ring-0 focus:border-none" type="text" value="28"/>
<span class="text-on-surface-variant font-body">yrs</span>
</div>
<div class="flex gap-1.5">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
</div>
</div>
<!-- Abstract Decorative Element (Clinical curator aesthetic) -->
<div class="pt-8 opacity-20">
<div class="w-full h-px bg-gradient-to-r from-transparent via-primary to-transparent"></div>
</div>
</main>
<!-- Footer: Progress & Navigation -->
<footer class="w-full max-w-xl px-6 pb-12 space-y-10">
<!-- Progress Indicator (Dot system) -->
<div class="flex justify-center gap-3">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-container"></div>
<div class="w-8 h-1.5 rounded-full bg-primary"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
<div class="flex items-center justify-between">
<button class="text-on-surface-variant font-label text-[10px] font-bold tracking-[0.2em] uppercase hover:text-on-surface transition-colors">
                Go Back
            </button>
<button class="bg-primary-container text-on-primary-container px-8 py-4 rounded-full flex items-center gap-3 clinical-glow group active:scale-95 transition-all">
<span class="font-label text-[10px] font-bold tracking-[0.2em] uppercase">Continue</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Background Decorative Textures -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 -translate-y-1/2 translate-x-1/2"></div>
<div class="fixed bottom-0 left-0 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl -z-10 translate-y-1/2 -translate-x-1/4"></div>
</body></html>
