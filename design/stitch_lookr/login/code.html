<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>lookr - Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-error': '#ffffff',
              'on-surface': '#191c1d',
              'inverse-on-surface': '#eff1f2',
              'tertiary-container': '#ffa15e',
              'surface-tint': '#006c48',
              'on-secondary-fixed-variant': '#165037',
              'on-primary-fixed': '#002113',
              'surface-container': '#eceeef',
              error: '#ba1a1a',
              'on-surface-variant': '#3c4a41',
              'surface-bright': '#f8fafb',
              'inverse-surface': '#2e3132',
              'on-tertiary-fixed-variant': '#723600',
              'primary-container': '#00d18e',
              secondary: '#31694e',
              'on-secondary': '#ffffff',
              'secondary-container': '#b4f0cd',
              'tertiary-fixed': '#ffdcc6',
              'surface-container-lowest': '#ffffff',
              'surface-variant': '#e1e3e4',
              'surface-dim': '#d8dadb',
              'outline-variant': '#bacabf',
              background: '#f8fafb',
              'on-primary': '#ffffff',
              primary: '#006c48',
              outline: '#6b7b70',
              'surface-container-high': '#e6e8e9',
              'inverse-primary': '#2fe19c',
              'on-tertiary': '#ffffff',
              'secondary-fixed-dim': '#99d3b2',
              'on-tertiary-container': '#743700',
              tertiary: '#934b0c',
              'secondary-fixed': '#b4f0cd',
              'tertiary-fixed-dim': '#ffb786',
              'surface-container-highest': '#e1e3e4',
              'surface-container-low': '#f2f4f5',
              'on-error-container': '#93000a',
              'on-secondary-fixed': '#002113',
              'on-tertiary-fixed': '#311300',
              'on-secondary-container': '#386f54',
              'on-primary-container': '#005336',
              'on-primary-fixed-variant': '#005235',
              'error-container': '#ffdad6',
              surface: '#f8fafb',
              'primary-fixed-dim': '#2fe19c',
              'on-background': '#191c1d',
              'primary-fixed': '#58feb7',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Manrope'],
              label: ['Manrope'],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24;
      }
      .abstract-logo-curve {
        border-top-right-radius: 100%;
        border-top: 4px solid #006c48;
        border-right: 4px solid #006c48;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface antialiased">
    <!-- Top Navigation Anchor (Shared Component Mapping) -->
    <!-- Suppressed per Rule: Transactional/Login screen suppresses navigation shell -->
    <main class="min-h-screen flex flex-col md:flex-row">
      <!-- Visual Side / Branding Canvas -->
      <div
        class="hidden md:flex md:w-1/2 bg-surface-container-low items-center justify-center p-12 relative overflow-hidden"
      >
        <div
          class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container/10 rounded-full blur-3xl"
        ></div>
        <div
          class="absolute bottom-[-5%] left-[-5%] w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl"
        ></div>
        <div class="z-10 flex flex-col items-start max-w-md">
          <!-- Abstract Logo Component -->
          <div class="mb-12 flex items-center gap-3">
            <div class="relative w-12 h-12">
              <div class="abstract-logo-curve w-10 h-10 absolute top-0 left-0"></div>
              <div class="absolute bottom-1 right-1 w-3 h-3 bg-primary rounded-full"></div>
            </div>
            <span class="font-headline font-extrabold text-3xl text-primary tracking-tighter"
              >lookr</span
            >
          </div>
          <h1 class="font-headline text-5xl font-extralight tracking-tight leading-tight mb-6">
            The <span class="font-bold text-primary">Clinical</span> <br />Curator.
          </h1>
          <p class="text-on-surface-variant text-lg leading-relaxed font-light">
            Transforming complex biological data into a curated visual narrative. Your health,
            decoded with medical precision.
          </p>
        </div>
      </div>
      <!-- Login Form Canvas -->
      <div class="flex-1 flex items-center justify-center p-6 sm:p-12 md:p-24 bg-surface">
        <div class="w-full max-w-sm">
          <!-- Mobile Logo -->
          <div class="md:hidden mb-12 flex items-center gap-2">
            <div class="relative w-8 h-8">
              <div
                class="abstract-logo-curve w-6 h-6 absolute top-0 left-0"
                style="border-width: 3px"
              ></div>
              <div class="absolute bottom-1 right-1 w-2 h-2 bg-primary rounded-full"></div>
            </div>
            <span class="font-headline font-extrabold text-xl text-primary tracking-tighter"
              >lookr</span
            >
          </div>
          <div class="mb-10">
            <h2 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-2">
              Welcome Back
            </h2>
            <p class="text-on-surface-variant font-light text-sm tracking-wide">
              Access your personal health laboratory.
            </p>
          </div>
          <form class="space-y-8">
            <!-- Email Field -->
            <div class="relative group">
              <label
                class="block font-label text-[10px] uppercase tracking-[0.15em] text-outline mb-1 transition-colors group-focus-within:text-primary"
                for="email"
              >
                Email Address
              </label>
              <input
                class="block w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 focus:ring-0 focus:border-primary text-on-surface placeholder:text-surface-dim transition-all"
                id="email"
                name="email"
                placeholder="name@laboratory.com"
                type="email"
              />
            </div>
            <!-- Password Field -->
            <div class="relative group">
              <div class="flex justify-between items-center mb-1">
                <label
                  class="block font-label text-[10px] uppercase tracking-[0.15em] text-outline transition-colors group-focus-within:text-primary"
                  for="password"
                >
                  Password
                </label>
                <a
                  class="font-label text-[9px] uppercase tracking-widest text-outline hover:text-primary transition-colors"
                  href="#"
                  >Forgot?</a
                >
              </div>
              <input
                class="block w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 focus:ring-0 focus:border-primary text-on-surface placeholder:text-surface-dim transition-all"
                id="password"
                name="password"
                placeholder="••••••••"
                type="password"
              />
            </div>
            <!-- CTA Button -->
            <div class="pt-4">
              <button
                class="w-full bg-primary-container text-on-primary-container font-headline font-bold py-4 rounded-full flex items-center justify-center gap-2 hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-sm"
                type="submit"
              >
                Login
                <span class="material-symbols-outlined text-xl" data-icon="arrow_forward"
                  >arrow_forward</span
                >
              </button>
            </div>
          </form>
          <!-- Secondary Actions -->
          <div class="mt-12 text-center">
            <p class="text-on-surface-variant text-sm font-light">
              New to the platform?
              <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#"
                >Sign Up</a
              >
            </p>
          </div>
          <!-- Clinical Disclaimer/Footer -->
          <div class="mt-24 flex items-center justify-center gap-4 opacity-40">
            <div class="h-[1px] flex-1 bg-outline-variant"></div>
            <span class="font-label text-[9px] uppercase tracking-[0.2em] whitespace-nowrap"
              >Clinical Grade Security</span
            >
            <div class="h-[1px] flex-1 bg-outline-variant"></div>
          </div>
        </div>
      </div>
    </main>
    <!-- Contextual FAB Suppression: Login screen does not require global FAB -->
  </body>
</html>
