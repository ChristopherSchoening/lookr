<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>lookr - Product Not Found</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-error': '#ffffff',
              'on-surface': '#191c1d',
              'inverse-on-surface': '#eff1f2',
              'tertiary-container': '#ffa15e',
              'surface-tint': '#006c48',
              'on-secondary-fixed-variant': '#165037',
              'on-primary-fixed': '#002113',
              'surface-container': '#eceeef',
              error: '#ba1a1a',
              'on-surface-variant': '#3c4a41',
              'surface-bright': '#f8fafb',
              'inverse-surface': '#2e3132',
              'on-tertiary-fixed-variant': '#723600',
              'primary-container': '#00d18e',
              secondary: '#31694e',
              'on-secondary': '#ffffff',
              'secondary-container': '#b4f0cd',
              'tertiary-fixed': '#ffdcc6',
              'surface-container-lowest': '#ffffff',
              'surface-variant': '#e1e3e4',
              'surface-dim': '#d8dadb',
              'outline-variant': '#bacabf',
              background: '#f8fafb',
              'on-primary': '#ffffff',
              primary: '#006c48',
              outline: '#6b7b70',
              'surface-container-high': '#e6e8e9',
              'inverse-primary': '#2fe19c',
              'on-tertiary': '#ffffff',
              'secondary-fixed-dim': '#99d3b2',
              'on-tertiary-container': '#743700',
              tertiary: '#934b0c',
              'secondary-fixed': '#b4f0cd',
              'tertiary-fixed-dim': '#ffb786',
              'surface-container-highest': '#e1e3e4',
              'surface-container-low': '#f2f4f5',
              'on-error-container': '#93000a',
              'on-secondary-fixed': '#002113',
              'on-tertiary-fixed': '#311300',
              'on-secondary-container': '#386f54',
              'on-primary-container': '#005336',
              'on-primary-fixed-variant': '#005235',
              'error-container': '#ffdad6',
              surface: '#f8fafb',
              'primary-fixed-dim': '#2fe19c',
              'on-background': '#191c1d',
              'primary-fixed': '#58feb7',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Manrope'],
              label: ['Manrope'],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24;
      }
      .clinical-gradient {
        background: linear-gradient(135deg, #006c48 0%, #00d18e 100%);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface antialiased overflow-x-hidden">
    <!-- TopAppBar -->
    <header
      class="fixed top-0 w-full z-50 bg-[#F8FAFB]/80 backdrop-blur-md flex items-center justify-between px-6 py-4 w-full"
    >
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" data-icon="close">close</span>
      </div>
      <h1 class="font-manrope font-extrabold text-2xl text-[#006C48] tracking-tighter">lookr</h1>
      <div
        class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden"
      >
        <span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person"
          >person</span
        >
      </div>
    </header>
    <main class="pt-24 pb-12 px-6 max-w-lg mx-auto min-h-screen flex flex-col">
      <!-- Abstract Not Found Header -->
      <section class="flex flex-col items-center text-center mb-10">
        <div class="w-32 h-32 mb-6 relative flex items-center justify-center">
          <!-- Abstract Path and Target Logo Element -->
          <svg class="w-full h-full text-primary-container" viewbox="0 0 100 100">
            <circle cx="50" cy="50" fill="currentColor" opacity="0.1" r="45"></circle>
            <path
              d="M30 70 L70 30"
              stroke="currentColor"
              stroke-dasharray="1 8"
              stroke-linecap="round"
              stroke-width="4"
            ></path>
            <circle cx="70" cy="30" fill="#006C48" r="6"></circle>
          </svg>
          <div class="absolute inset-0 flex items-center justify-center">
            <span
              class="material-symbols-outlined text-4xl text-primary"
              data-icon="barcode_scanner"
              >barcode_scanner</span
            >
          </div>
        </div>
        <h2 class="font-headline font-bold text-3xl tracking-tight text-on-surface mb-2">
          Product Not Found
        </h2>
        <p class="text-on-surface-variant text-sm max-w-[280px]">
          Our clinical database doesn't recognize this barcode yet. Help us curate the world's
          nutrition data.
        </p>
      </section>
      <!-- Bento Metadata -->
      <div class="grid grid-cols-2 gap-3 mb-8">
        <div class="bg-surface-container-low p-5 rounded-xl">
          <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">
            Detected Code
          </p>
          <p class="font-mono font-medium text-primary text-sm tracking-tighter">8410239485012</p>
        </div>
        <div class="bg-surface-container-low p-5 rounded-xl border-l-4 border-primary-container">
          <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">
            Community Credit
          </p>
          <div class="flex items-center gap-1">
            <span
              class="material-symbols-outlined text-primary text-xs"
              data-icon="stars"
              style="font-variation-settings: 'FILL' 1"
              >stars</span
            >
            <p class="font-bold text-on-surface text-sm">+25 pts</p>
          </div>
        </div>
      </div>
      <!-- Add to Database Form -->
      <div class="space-y-10">
        <div class="relative">
          <label
            class="block font-label text-[10px] uppercase tracking-widest text-primary mb-2"
            for="product_title"
            >Product Title</label
          >
          <input
            class="w-full bg-transparent border-0 border-b border-outline-variant focus:ring-0 focus:border-primary px-0 py-2 text-lg font-medium placeholder:text-surface-dim transition-colors"
            id="product_title"
            placeholder="e.g. Organic Almond Milk"
            type="text"
          />
        </div>
        <div>
          <label
            class="block font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-4"
            >Category Selection</label
          >
          <div class="flex flex-wrap gap-2">
            <button
              class="px-5 py-2.5 rounded-full bg-secondary-fixed text-on-secondary-container text-xs font-bold transition-all hover:opacity-80"
            >
              Breakfast
            </button>
            <button
              class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-medium hover:bg-surface-container-highest transition-all"
            >
              Lunch
            </button>
            <button
              class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-medium hover:bg-surface-container-highest transition-all"
            >
              Dinner
            </button>
            <button
              class="px-5 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-medium hover:bg-surface-container-highest transition-all"
            >
              Snack
            </button>
          </div>
        </div>
        <div class="bg-surface-container-low p-6 rounded-2xl relative overflow-hidden group">
          <div class="relative z-10 flex items-center justify-between">
            <div>
              <h4 class="font-headline font-bold text-on-surface">Nutritional Details</h4>
              <p class="text-xs text-on-surface-variant mt-1">
                Upload a photo of the label for AI parsing
              </p>
            </div>
            <button
              class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-sm text-primary group-hover:scale-110 transition-transform"
            >
              <span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
            </button>
          </div>
          <!-- Abstract visual texture -->
          <div
            class="absolute -right-4 -bottom-4 w-24 h-24 bg-primary-container/10 rounded-full blur-2xl"
          ></div>
        </div>
      </div>
      <!-- Action Button -->
      <div class="mt-auto pt-10">
        <button
          class="w-full py-4 rounded-full clinical-gradient text-white font-bold text-sm tracking-wider uppercase shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all"
        >
          Add to Database
        </button>
        <button
          class="w-full py-4 mt-2 text-on-surface-variant font-medium text-xs hover:text-primary transition-colors"
        >
          Cancel and return to scanner
        </button>
      </div>
    </main>
    <!-- Navigation Shell Suppressed for Focus Journey (Product Entry) -->
  </body>
</html>
